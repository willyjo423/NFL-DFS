name: DFS lineups

on:
  workflow_dispatch:
    inputs:
      draft_group:
        description: "Draft group id (blank = pick the busiest slate below)"
        required: false
        default: ""
      slate:
        description: "showdown or classic - used when draft group is blank"
        required: false
        default: "classic"
      site:
        description: "dk or fd"
        required: false
        default: "dk"
      classic:
        description: "Classic roster rules instead of showdown"
        type: boolean
        required: false
        default: false
      entries:
        description: "How many lineups per objective (1-5)"
        required: false
        default: "1"
      sims:
        description: "Simulations (blank = 50,000)"
        required: false
        default: ""

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline checks
        run: |
          python test_scoring.py
          python test_features.py
          python test_optimise.py

      - name: Build lineups
        run: |
          mkdir -p data/lineups
          ARGS="--site ${{ inputs.site }} --entries ${{ inputs.entries }}"
          if [ -n "${{ inputs.draft_group }}" ]; then
            ARGS="$ARGS --draft-group ${{ inputs.draft_group }}"
          fi
          ARGS="$ARGS --slate ${{ inputs.slate }}"
          if [ "${{ inputs.classic }}" = "true" ]; then ARGS="$ARGS --classic"; fi
          if [ -n "${{ inputs.sims }}" ]; then ARGS="$ARGS --sims ${{ inputs.sims }}"; fi
          echo "EFFECTIVE ARGS: $ARGS"
          python lineups.py $ARGS | tee lineups.txt

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfs-lineups
          path: |
            lineups.txt
            data/lineups/latest.csv
          retention-days: 30
          if-no-files-found: warn
