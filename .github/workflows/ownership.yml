name: DFS ownership probe

# Can we COUNT what the field played, rather than guess it?
#
# This has to run against a SETTLED contest - DraftKings publishes standings
# only after a contest finalises, which is a while after the game ends, not the
# moment the clock hits zero. Run it the morning after a slate.
#
# It decides how good the tournament side can ever be. A GPP is won by being
# right where the field is wrong, and leverage cannot be computed from
# projections alone. If this endpoint is open, ownership is measured; if it is
# closed, the field has to be modelled from priors and everything built on it
# is weaker. Worth knowing before the GPP optimiser is trusted, not after.

on:
  workflow_dispatch:
    inputs:
      contest:
        description: "Contest id to probe (blank = find recent settled ones)"
        required: false
        default: ""
      limit:
        description: "How many contests to try when none is given"
        required: false
        default: "3"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe
        run: |
          ARGS="--limit ${{ inputs.limit }}"
          if [ -n "${{ inputs.contest }}" ]; then
            ARGS="$ARGS --contest ${{ inputs.contest }}"
          fi
          echo "EFFECTIVE ARGS: $ARGS"
          python ownership_probe.py $ARGS | tee ownership.txt

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfs-ownership-probe
          path: ownership.txt
          retention-days: 30
          if-no-files-found: warn
