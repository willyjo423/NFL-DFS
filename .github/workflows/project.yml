name: DFS projections

# Fit the quantile models and project one live slate.
#
# The join gate can stop this on purpose. When it does, the report is already
# printed above the failure - including every unmatched player with his price -
# so read that list before reaching for `force`. Expensive misses mean the join
# is broken; kickers and defences mean it is working as designed.

on:
  workflow_dispatch:
    inputs:
      draft_group:
        description: "DraftKings draft group id (blank = pick the busiest slate)"
        required: false
        default: ""
      slate:
        description: "showdown or classic (used only when draft group is blank)"
        required: false
        default: "showdown"
      site:
        description: "dk or fd"
        required: false
        default: "dk"
      force:
        description: "Write the CSV even if the join gate fails"
        type: boolean
        required: false
        default: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Offline first. If the scoring rules or the feature build are wrong, a
      # projection produced from them is wrong in a way no amount of staring at
      # the output will reveal.
      - name: Offline checks
        run: |
          python test_scoring.py
          python test_features.py

      - name: Project
        run: |
          mkdir -p data/projections
          ARGS="--site ${{ inputs.site }}"
          if [ -n "${{ inputs.draft_group }}" ]; then
            ARGS="$ARGS --draft-group ${{ inputs.draft_group }}"
          else
            ARGS="$ARGS --slate ${{ inputs.slate }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "EFFECTIVE ARGS: $ARGS"
          python project.py $ARGS | tee projections.txt

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfs-projections
          path: |
            projections.txt
            data/projections/latest.csv
          retention-days: 30
          if-no-files-found: warn
