name: Sport probe

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Sports to probe, space separated (blank = nba mlb nhl cfb)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.sports }}" ]; then
            ARGS="--sports ${{ inputs.sports }}"
          fi
          echo "EFFECTIVE ARGS: $ARGS"
          if [ -n "$CFBD_API_KEY" ]; then
            echo "CFBD key: present (${#CFBD_API_KEY} chars)"
          else
            echo "CFBD key: NOT SET - college football will come back 401"
          fi
          python sport_probe.py $ARGS 2>&1 | tee sportprobe.txt

      - name: Put it on the run page
        if: always()
        run: |
          {
            echo '## Sport probe'
            echo '```'
            tail -c 60000 sportprobe.txt || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sport-probe
          path: sportprobe.txt
          retention-days: 30
          if-no-files-found: warn
