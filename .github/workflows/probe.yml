name: DFS probe

# What the DFS data actually contains. Run this first - its output decides
# whether the rest gets written, and section 3 (do the names join) decides it
# more than the others.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to probe, space separated (blank = 2023 2024 2025)"
        required: false
        default: ""
      weeks:
        description: "Weeks to sample for salaries (blank = 3 10)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe
        run: |
          ARGS=""
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          if [ -n "${{ inputs.weeks }}" ]; then ARGS="$ARGS --weeks ${{ inputs.weeks }}"; fi
          python dfs_probe.py $ARGS | tee dfsprobe.txt
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfs-probe-output
          path: dfsprobe.txt
          retention-days: 30
